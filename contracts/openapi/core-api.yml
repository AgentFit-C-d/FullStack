openapi: 3.0.3
info:
  title: AgentFit Core API
  version: 0.2.0
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      summary: Core API health check
      operationId: getCoreApiHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                service: core-api
                status: ok
  /api/oauth2/authorization/github:
    get:
      summary: Start GitHub OAuth login
      description: "Starts the same-origin OAuth flow. The reverse proxy and GitHub OAuth App must use `/api/login/oauth2/code/github` as the callback URL."
      operationId: startGitHubOAuth
      responses:
        "302":
          description: Redirect to GitHub authorization endpoint
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
  /api/login/oauth2/code/github:
    get:
      summary: Receive GitHub OAuth callback
      description: Spring Boot consumes the provider callback, finds the USER only by the immutable GitHub ID or creates one with `github_user_id` and `github_login`, creates the server session, then redirects to `/?login=success`; failed or cancelled login redirects to `/?login=failed`. Provider tokens, provider error details, code, and state are never exposed in the response body or redirect query. Existing users are never linked by email, name, or GitHub login.
      operationId: completeGitHubOAuth
      responses:
        "302":
          description: Redirect to `/?login=success` or `/?login=failed`
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri-reference
            Set-Cookie:
              required: false
              description: "Present only after successful login: `AGENTFIT_SESSION`, host-only, `Path=/`, `HttpOnly`, production `Secure`, `SameSite=Lax`, and `Max-Age=7일`. Failed or cancelled login does not issue this cookie."
              schema:
                type: string
  /api/auth/csrf:
    get:
      summary: Issue a CSRF token for same-origin state-changing requests
      operationId: issueCsrfToken
      responses:
        "204":
          description: "A session-only, `Path=/`, non-HttpOnly, production `Secure`, `SameSite=Lax` `XSRF-TOKEN` cookie is issued; JavaScript reads it and sends the same value in `X-XSRF-TOKEN` for POST, PUT, PATCH, and DELETE requests under `/api`."
          headers:
            Set-Cookie:
              description: "A session-only, `Path=/`, non-HttpOnly, production `Secure`, `SameSite=Lax` `XSRF-TOKEN` cookie. It is separate from the HttpOnly `Path=/` `AGENTFIT_SESSION` cookie."
              schema:
                type: string
  /api/auth/logout:
    post:
      summary: Log out the current user
      operationId: logout
      security:
        - agentFitSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Spring Session JDBC server-side session and `AGENTFIT_SESSION` cookie invalidated
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfRejected"
  /api/auth/get-session:
    get:
      summary: Return the safe current session or null
      operationId: getSession
      responses:
        "200":
          description: Authenticated public session or unauthenticated null
          content:
            application/json:
              schema:
                nullable: true
                allOf:
                  - $ref: "#/components/schemas/PublicSession"
        "500":
          $ref: "#/components/responses/InternalError"
  /api/projects:
    get:
      summary: List projects owned by the authenticated user
      operationId: listProjects
      security:
        - agentFitSession: []
      responses:
        "200":
          description: Projects ordered by updatedAt descending, then id ascending
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    post:
      summary: Create a project owned by the authenticated user
      operationId: createProject
      security:
        - agentFitSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [metadata]
              properties:
                metadata:
                  $ref: "#/components/schemas/ProjectCreateMetadataRequest"
                file:
                  type: string
                  format: binary
                inputText:
                  type: string
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectCreateRequest"
      responses:
        "201":
          description: Created project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "422":
          $ref: "#/components/responses/InvalidInput"
  /api/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      summary: Get a project and its current analysis state
      operationId: getProject
      security:
        - agentFitSession: []
      responses:
        "200":
          description: Project detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/ProjectNotFound"
    delete:
      summary: Delete an owned project and its dependent data
      operationId: deleteProject
      security:
        - agentFitSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectDeleteRequest"
      responses:
        "204":
          description: Deleted; response has no JSON body
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/CsrfRejected"
        "404":
          $ref: "#/components/responses/ProjectNotFound"
        "409":
          description: Version conflict or active analysis deletion forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          $ref: "#/components/responses/InvalidInput"
    patch:
      summary: Update project metadata
      operationId: updateProject
      security:
        - agentFitSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProjectUpdateRequest"
      responses:
        "200": { description: Updated project detail }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { $ref: "#/components/responses/InvalidInput" }
    put:
      summary: Replace planning input
      operationId: replacePlanningInput
      security:
        - agentFitSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [expectedVersion]
              properties:
                expectedVersion: { type: integer }
                file: { type: string, format: binary }
                inputText: { type: string }
      responses:
        "200": { description: Replaced planning input metadata }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "409": { description: Version or active analysis conflict, with ErrorResponse body }
        "422": { $ref: "#/components/responses/InvalidInput" }
  /api/projects/{projectId}/analysis-attempts:
    post:
      summary: Start an analysis attempt
      operationId: startProjectAnalysis
      security:
        - agentFitSession: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisStartRequest"
      responses:
        "202": { description: Analysis accepted as PROCESSING }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "409": { $ref: "#/components/responses/AnalysisConflict" }
        "429": { $ref: "#/components/responses/AnalysisCapacity" }
  /api/projects/{projectId}/profile/confirm:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      summary: Confirm the structured A DRAFT for B recommendation
      operationId: confirmProjectProfile
      security:
        - agentFitSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileConfirmationRequest"
      responses:
        "200":
          description: CONFIRMED Profile created while retaining the DRAFT
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileConfirmationResponse"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CsrfRejected" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { $ref: "#/components/responses/InvalidInput" }
  /api/projects/{projectId}/recommendation-inputs:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      summary: Read the owner's developer and environment declarations
      operationId: getRecommendationInputs
      security:
        - agentFitSession: []
      responses:
        "200":
          description: Null profile means not entered yet; installedComponentsKnown distinguishes unknown from known empty
          content:
            application/json:
              schema:
                type: object
                properties:
                  developer: { $ref: "#/components/schemas/DeveloperProfileInputState" }
                  environment: { $ref: "#/components/schemas/EnvironmentProfileInputState" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "409": { $ref: "#/components/responses/RecommendationConflict" }
  /api/projects/{projectId}/developer-profile:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    put:
      summary: Save the owner's developer role and responsibilities after profile confirmation
      operationId: saveDeveloperProfileInput
      security:
        - agentFitSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, role, responsibilities]
              properties:
                expectedVersion: { type: integer, format: int64, minimum: 0 }
                role: { type: string, maxLength: 30 }
                responsibilities:
                  type: array
                  maxItems: 30
                  items: { type: string, maxLength: 200 }
      responses:
        "200": { $ref: "#/components/responses/SavedInputVersion" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CsrfRejected" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { $ref: "#/components/responses/InvalidInput" }
  /api/projects/{projectId}/environment-profile:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    put:
      summary: Save the owner's declared target and installed components after profile confirmation
      operationId: saveEnvironmentProfileInput
      security:
        - agentFitSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expectedVersion, osFamily, clientId, clientVersion, installedComponentsKnown, installedComponents]
              properties:
                expectedVersion: { type: integer, format: int64, minimum: 0 }
                osFamily: { type: string, maxLength: 30 }
                clientId: { type: string, maxLength: 200 }
                clientVersion: { type: string, maxLength: 200 }
                installedComponentsKnown: { type: boolean }
                installedComponents:
                  type: array
                  maxItems: 50
                  items: { $ref: "#/components/schemas/InstalledComponentInput" }
      responses:
        "200": { $ref: "#/components/responses/SavedInputVersion" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CsrfRejected" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { $ref: "#/components/responses/InvalidInput" }
  /api/projects/{projectId}/recommendations:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      summary: Create an owner-checked recommendation
      operationId: createRecommendation
      security:
        - agentFitSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RecommendationCreateRequest"
      responses:
        "201":
          description: Recommendation created with its immutable basis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResponse"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CsrfRejected" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "409": { $ref: "#/components/responses/RecommendationConflict" }
        "422": { $ref: "#/components/responses/InvalidInput" }
        "503": { $ref: "#/components/responses/InternalError" }
  /api/projects/{projectId}/recommendations/latest:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      summary: Read the latest owner-checked recommendation
      operationId: getLatestRecommendation
      security:
        - agentFitSession: []
      responses:
        "200":
          description: Latest recommendation without an AI call
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecommendationResponse"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
  /api/projects/{projectId}/recommendations/{recommendationId}/answers:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: recommendationId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      summary: Read saved answers for an owner-checked recommendation
      operationId: listRecommendationAnswers
      security:
        - agentFitSession: []
      responses:
        "200":
          description: Saved answers; answers do not change confirmed facts or the recommendation
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RecommendationQuestionAnswer" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
  /api/projects/{projectId}/recommendations/{recommendationId}/answers/{noticeId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
      - name: recommendationId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: noticeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      summary: Save an answer to a current NEEDS_INFORMATION question
      operationId: saveRecommendationAnswer
      security:
        - agentFitSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        "200":
          description: Answer annotation saved without changing confirmed facts or recommendation status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecommendationQuestionAnswer" }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CsrfRejected" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "422": { $ref: "#/components/responses/InvalidInput" }
  /api/projects/{projectId}/config-previews:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    post:
      summary: Create a trusted configuration Preview
      operationId: createConfigPreview
      security:
        - agentFitSession: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewCreateRequest"
      responses:
        "201":
          description: Transient Preview files, unmet capability warnings, and saved content-free metadata
          headers:
            Cache-Control:
              description: Transient file content must not be cached.
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PreviewResponse"
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "403": { $ref: "#/components/responses/CsrfRejected" }
        "404": { $ref: "#/components/responses/ProjectNotFound" }
        "409": { $ref: "#/components/responses/VersionConflict" }
        "413":
          description: Preview JSON body exceeds 1 MiB and is not processed
        "422": { $ref: "#/components/responses/InvalidInput" }
  /api/tool-candidates:
    get:
      summary: Read staged skills.sh research candidates
      description: Candidates are unverified and are never used by recommendation or configuration generation.
      operationId: getSkillCandidates
      security:
        - agentFitSession: []
      responses:
        "200":
          description: Staged discovery candidates, explicitly marked unverified
          content:
            application/json:
              schema:
                type: object
                required: [source, verificationStatus, candidates]
                properties:
                  source: { type: string, enum: [skills.sh] }
                  verificationStatus: { type: string, enum: [UNVERIFIED] }
                  candidates:
                    type: array
                    items:
                      type: object
                      required: [externalId, name, source, sourceUrl, contentHash, observedAt]
                      properties:
                        externalId: { type: string }
                        name: { type: string }
                        source: { type: string }
                        sourceUrl: { type: string, format: uri }
                        contentHash: { type: string, pattern: "^[0-9a-f]{64}$" }
                        observedAt: { type: string, format: date-time }
        "401": { $ref: "#/components/responses/Unauthenticated" }
        "503":
          description: Candidate snapshot is absent or invalid
components:
  securitySchemes:
    agentFitSession:
      type: apiKey
      in: cookie
      name: AGENTFIT_SESSION
      description: "Spring Session JDBC session cookie. It is host-only, `Path=/`, `HttpOnly`, production `Secure`, `SameSite=Lax`, and `Max-Age=7일`; it is not a bearer token."
  parameters:
    CsrfToken:
      name: X-XSRF-TOKEN
      in: header
      required: true
      description: "Value issued by `GET /api/auth/csrf` in the readable `XSRF-TOKEN` cookie."
      schema:
        type: string
        minLength: 1
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
  responses:
    SavedInputVersion:
      description: Saved B input version for the next optimistic update or recommendation request
      content:
        application/json:
          schema:
            type: object
            required: [version]
            properties:
              version: { type: integer, format: int64, minimum: 1 }
    Unauthenticated:
      description: Login required or session expired
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CsrfRejected:
      description: CSRF token is missing or does not match the current browser context
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ProjectNotFound:
      description: Project does not exist or is not owned by the caller
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidInput:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    VersionConflict:
      description: The supplied expected version is no longer current; refresh before retrying
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RecommendationConflict:
      description: "Error code is `VERSION_CONFLICT` when a supplied version is stale, or `PROFILE_NOT_CONFIRMED` when the user must review and confirm the A DRAFT before requesting B."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AnalysisConflict:
      description: "Error code is `ANALYSIS_ALREADY_PROCESSING` for duplicate project requests or `ANALYSIS_ACTIVE_PROJECT_DELETE_FORBIDDEN` for deletion during active analysis."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    AnalysisCapacity:
      description: "Error code is `ANALYSIS_USER_LIMIT_REACHED` for the per-user limit or `ANALYSIS_SERVER_LIMIT_REACHED` for the server-wide limit."
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    InstalledComponentInput:
      type: object
      required: [toolKey]
      properties:
        toolKey: { type: string, maxLength: 200 }
        version: { type: string, nullable: true, maxLength: 200 }
    DeveloperProfileInputState:
      type: object
      nullable: true
      required: [version, role, responsibilities]
      properties:
        version: { type: integer, format: int64 }
        role: { type: string }
        responsibilities:
          type: array
          items: { type: string }
    EnvironmentProfileInputState:
      type: object
      nullable: true
      required: [version, osFamily, clientId, clientVersion, installedComponentsKnown, installedComponents]
      properties:
        version: { type: integer, format: int64 }
        osFamily: { type: string }
        clientId: { type: string }
        clientVersion: { type: string }
        installedComponentsKnown: { type: boolean }
        installedComponents:
          type: array
          items: { $ref: "#/components/schemas/InstalledComponentInput" }
    HealthResponse:
      type: object
      required:
        - service
        - status
      properties:
        service:
          type: string
        status:
          type: string
    PublicSession:
      type: object
      required:
        - user
        - session
      properties:
        user:
          type: object
          required: [id, name]
          properties:
            id: { type: string }
            name: { type: string }
        session:
          type: object
          required: [expiresAt]
          properties:
            expiresAt:
              type: string
              format: date-time
    Project:
      type: object
      required: [id, name, version, createdAt, updatedAt, role, runtimes]
      properties:
        id: { type: string }
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: Trimmed string measured in Unicode code points
        version: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        role: { type: string, enum: [FRONTEND, BACKEND, FULL_STACK, AI, DESIGNER] }
        runtimes:
          type: array
          maxItems: 30
          items:
            type: string
            maxLength: 200
      additionalProperties: false
    ProjectResponse:
      type: object
      required: [project]
      properties:
        project:
          $ref: "#/components/schemas/Project"
    ProjectListResponse:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/Project"
    ProjectCreateRequest:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    ProjectCreateMetadataRequest:
      type: object
      required: [name, role]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        role: { type: string, enum: [FRONTEND, BACKEND, FULL_STACK, AI, DESIGNER] }
        runtimes: { type: string }
    ProjectUpdateRequest:
      type: object
      required: [expectedVersion]
      properties:
        name: { type: string, maxLength: 100 }
        role: { type: string, enum: [FRONTEND, BACKEND, FULL_STACK, AI, DESIGNER] }
        runtimes: { type: string }
        expectedVersion: { type: integer, minimum: 1 }
    AnalysisStartRequest:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    ProjectDeleteRequest:
      type: object
      required: [confirmation, expectedVersion]
      additionalProperties: false
      properties:
        confirmation:
          type: boolean
          enum: [true]
        expectedVersion:
          type: integer
          minimum: 0
    ProjectDetailResponse:
      type: object
      required: [project, confirmed, draft, latestAttempt]
      properties:
        project:
          $ref: "#/components/schemas/Project"
        confirmed:
          nullable: true
          type: object
          additionalProperties: true
    RecommendationCreateRequest:
      type: object
      required: [expectedVersions]
      additionalProperties: false
      properties:
        expectedVersions:
          type: object
          required: [project, developer, environment]
          properties:
            project: { type: integer, minimum: 1 }
            developer: { type: integer, minimum: 0 }
            environment: { type: integer, minimum: 0 }
    ProfileConfirmationRequest:
      type: object
      required: [expectedDraftVersion, requestId]
      additionalProperties: false
      properties:
        expectedDraftVersion: { type: integer, minimum: 1 }
        requestId: { type: string, minLength: 1, maxLength: 100 }
        projectName: { type: string, nullable: true, maxLength: 200 }
        projectType: { type: string, nullable: true, maxLength: 200 }
        domain: { type: string, nullable: true, maxLength: 200 }
        fieldMetadata: { type: string, nullable: true }
        items:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: false
            required: [fieldKey, ordinal, name, source, evidence]
            properties:
              fieldKey: { type: string, minLength: 1, maxLength: 40 }
              ordinal: { type: integer, minimum: 0 }
              category: { type: string, nullable: true, maxLength: 30 }
              area: { type: string, nullable: true, maxLength: 40 }
              name: { type: string, minLength: 1, maxLength: 200 }
              version: { type: string, nullable: true, maxLength: 50 }
              source: { type: string, enum: [DOCUMENT, USER] }
              evidence: { type: string }
    ProfileConfirmationResponse:
      type: object
      required: [projectId, confirmedProfileId, confirmedProfileVersion, confirmationEventId, projectVersion, sourceDraftVersion]
      properties:
        projectId: { type: string, format: uuid }
        confirmedProfileId: { type: string, format: uuid }
        confirmedProfileVersion: { type: integer, minimum: 1 }
        confirmationEventId: { type: string, format: uuid }
        projectVersion: { type: integer, minimum: 0 }
        sourceDraftVersion: { type: integer, minimum: 1 }
    RecommendationResponse:
      type: object
      required: [recommendationId, status, basis]
      properties:
        recommendationId: { type: string, format: uuid }
        status: { type: string, enum: [RECOMMENDED, NO_ADDITIONS_NEEDED, NEEDS_INFORMATION, NO_COMPATIBLE_TOOLS] }
        evidenceLevel:
          type: string
          enum: [PLAN_ONLY, ENVIRONMENT_DECLARED]
          description: Input evidence level recorded when this recommendation was created; this does not attest installation or execution.
        createdAt: { type: string, format: date-time }
        basis:
          type: object
          required: [projectId, projectVersion, confirmedProfileId, confirmedProfileVersion, confirmationEventId, reviewVersion, developerVersion, environmentVersion, catalogReleaseId, catalogHash]
          properties:
            projectId: { type: string, format: uuid }
            projectVersion: { type: integer, minimum: 0 }
            confirmedProfileId: { type: string, format: uuid }
            confirmedProfileVersion: { type: integer, minimum: 1 }
            confirmationEventId: { type: string, format: uuid }
            reviewVersion: { type: integer, minimum: 0 }
            developerVersion: { type: integer, minimum: 0 }
            environmentVersion: { type: integer, minimum: 0 }
            catalogReleaseId: { type: string }
            catalogHash: { type: string, pattern: '^[0-9a-f]{64}$' }
        capabilities: { type: array, items: { type: object, additionalProperties: true } }
        items:
          type: array
          description: Current, approved Catalog items only. Empty when validity is STALE; each reason is a deterministic B Catalog explanation, not an AI-generated claim.
          items:
            type: object
            additionalProperties: true
            required: [reason]
            properties:
              reason: { type: string, minLength: 1 }
        savedItems:
          type: array
          description: Tool keys, versions and reasons saved with the recommendation. Historical display only; these rows do not prove current support or grant permissions, including when validity is STALE.
          items:
            type: object
            additionalProperties: false
            required: [toolKey, toolVersion, reason]
            properties:
              toolKey: { type: string }
              toolVersion: { type: string }
              reason: { type: string, minLength: 1 }
        notices: { type: array, items: { type: object, additionalProperties: true } }
    RecommendationQuestionAnswer:
      type: object
      required: [noticeId, recommendationId, answerTarget, answer, actorId, createdAt, updatedAt]
      properties:
        noticeId: { type: string, format: uuid }
        recommendationId: { type: string, format: uuid }
        answerTarget: { type: string }
        answer: { type: string, minLength: 1, maxLength: 4000 }
        actorId: { type: string, format: uuid }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PreviewCreateRequest:
      type: object
      required: [basis, recommendationId, target, selectedToolKeys, permissionSelections, existingState, providedFiles, generatorVersion]
      additionalProperties: false
      properties:
        basis:
          $ref: "#/components/schemas/PreviewBasis"
        recommendationId: { type: string, format: uuid }
        target:
          $ref: "#/components/schemas/EnvironmentTarget"
        selectedToolKeys: { type: array, items: { type: string }, maxItems: 20 }
        permissionSelections: { type: array, items: { type: object, additionalProperties: true } }
        existingState: { type: string, enum: [UNKNOWN, USER_SAYS_EMPTY, PROVIDED] }
        generatorVersion: { type: string, minLength: 1, maxLength: 100 }
        providedFiles: { type: array, items: { type: object, additionalProperties: false } }
    PreviewBasis:
      type: object
      required: [projectId, projectVersion, confirmedProfileId, confirmedProfileVersion, confirmationEventId, reviewVersion, developerVersion, environmentVersion, catalogReleaseId, catalogHash]
      properties:
        projectId: { type: string, format: uuid }
        projectVersion: { type: integer, minimum: 1 }
        confirmedProfileId: { type: string, format: uuid }
        confirmedProfileVersion: { type: integer, minimum: 1 }
        confirmationEventId: { type: string, format: uuid }
        reviewVersion: { type: integer, minimum: 0 }
        developerVersion: { type: integer, minimum: 0 }
        environmentVersion: { type: integer, minimum: 0 }
        catalogReleaseId: { type: string, minLength: 1 }
        catalogHash: { type: string, pattern: '^[0-9a-f]{64}$' }
    EnvironmentTarget:
      type: object
      required: [osFamily, clientId, clientVersion]
      properties:
        osFamily: { type: string, minLength: 1 }
        clientId: { type: string, minLength: 1 }
        clientVersion: { type: string, minLength: 1 }
    PreviewResponse:
      type: object
      required: [previewId, recommendationId, fingerprint, selectionDigest, contentDigest, createdAt, expiresAt, unmetCapabilityKeys, files]
      properties:
        previewId: { type: string, format: uuid }
        recommendationId: { type: string, format: uuid }
        fingerprint: { type: string, pattern: '^[0-9a-f]{64}$' }
        selectionDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
        contentDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time }
        unmetCapabilityKeys:
          description: Required capabilities still missing after the selected partial configuration; an empty array means complete coverage.
          type: array
          items: { type: string }
        files:
          description: Transient generated content and comparison details for user review; these bytes are not stored.
          type: array
          items:
            type: object
            required: [targetKey, relativePath, action, afterHash, content, comparisonScope]
            properties:
              targetKey: { type: string }
              relativePath: { type: string }
              action: { type: string, enum: [PROPOSAL, UPDATE] }
              beforeHash: { type: string, nullable: true }
              afterHash: { type: string }
              content: { type: string }
              diff: { type: string, nullable: true }
              comparisonScope: { type: string, enum: [EXISTING_UNKNOWN, PROVIDED_FILE] }
        draft:
          nullable: true
          type: object
          additionalProperties: true
        latestAttempt:
          nullable: true
          type: object
          additionalProperties: true
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            fields:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
