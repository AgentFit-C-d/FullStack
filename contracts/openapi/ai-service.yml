openapi: 3.0.3
info:
  title: AgentFit AI Service
  version: 0.1.0
servers:
  - url: http://localhost:8001
paths:
  /health:
    get:
      summary: AI service health check
      operationId: getAiServiceHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                service: ai-service
                status: ok
  /internal/v1/analysis:
    post:
      summary: Process a Core API-owned analysis request
      description: Internal endpoint only. It accepts no browser cookie, Bearer/JWT, GitHub token, user permission, or project-ownership information. Canonical HMAC input is METHOD, PATH, X-AgentFit-Timestamp, requestId, generation, contractVersion, and lowercase SHA-256 hex of the exact UTF-8 request body, separated by LF. HMAC verifies Core API request provenance and integrity; Core API remains responsible for persistence and authorization.
      operationId: processAnalysis
      parameters:
        - $ref: "#/components/parameters/AgentFitKeyId"
        - $ref: "#/components/parameters/AgentFitTimestamp"
        - $ref: "#/components/parameters/AgentFitSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisRequest"
      responses:
        "200":
          description: Structured analysis proposal only. Core API must revalidate ownership, generation, deadline, and project state before persistence.
          content:
            application/json:
              schema:
              $ref: "#/components/schemas/AnalysisResponse"
        "400":
          $ref: "#/components/responses/InvalidAnalysisRequest"
        "401":
          $ref: "#/components/responses/InternalAuthFailed"
        "503":
          $ref: "#/components/responses/TemporarilyUnavailable"
  /internal/v1/skills/needs:
    post:
      summary: Derive bounded skill needs from confirmed facts
      operationId: processSkillNeeds
      parameters:
        - $ref: "#/components/parameters/AgentFitKeyId"
        - $ref: "#/components/parameters/AgentFitTimestamp"
        - $ref: "#/components/parameters/AgentFitSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillNeedsRequest"
      responses:
        "200":
          description: At most six needs and the existing nine Capability assessment entries.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillNeedsResponse"
        "400":
          $ref: "#/components/responses/InvalidSkillRequest"
        "401":
          $ref: "#/components/responses/InternalAuthFailed"
  /internal/v1/skills/rank:
    post:
      summary: Score supplied skill candidates without changing Core recommendation state
      operationId: processSkillRank
      parameters:
        - $ref: "#/components/parameters/AgentFitKeyId"
        - $ref: "#/components/parameters/AgentFitTimestamp"
        - $ref: "#/components/parameters/AgentFitSignature"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkillRankRequest"
      responses:
        "200":
          description: Candidate scores only. This response is not a recommendation decision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkillRankResponse"
        "400":
          $ref: "#/components/responses/InvalidSkillRequest"
        "401":
          $ref: "#/components/responses/InternalAuthFailed"
components:
  parameters:
    AgentFitKeyId:
      name: X-AgentFit-Key-Id
      in: header
      required: true
      description: Identifier of the current or briefly retained previous HMAC key.
      schema:
        type: string
        minLength: 1
    AgentFitTimestamp:
      name: X-AgentFit-Timestamp
      in: header
      required: true
      description: Unix epoch seconds. The AI Service accepts only timestamps within ±5 minutes of its server clock.
      schema:
        type: string
        pattern: '^\d{10}$'
    AgentFitSignature:
      name: X-AgentFit-Signature
      in: header
      required: true
      description: Padding-free base64url-encoded HMAC-SHA256 of the canonical string defined by this contract.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]+$'
  responses:
    InvalidAnalysisRequest:
      description: Required request context or analysis input is malformed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalErrorResponse"
          example:
            error:
              code: INVALID_AI_REQUEST
              message: Analysis request is invalid.
              requestId: core-request-id
    InternalAuthFailed:
      description: HMAC, timestamp, or duplicate-request validation failed. The response deliberately does not distinguish the cause.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalErrorResponse"
          example:
            error:
              code: INTERNAL_AUTH_FAILED
              message: Internal request authentication failed.
              requestId: core-request-id
    TemporarilyUnavailable:
      description: AI Service did not accept or begin processing the request. It must not retain the request fingerprint; Core API may retry once with the same context. A timeout or any response with uncertain processing state is not retried.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalErrorResponse"
    InvalidSkillRequest:
      description: Needs or rank input is malformed or exceeds its bounded limits.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/InternalErrorResponse"
  schemas:
    HealthResponse:
      type: object
      required:
        - service
        - status
      properties:
        service:
          type: string
        status:
          type: string
    AnalysisRequest:
      type: object
      required: [requestId, generation, contractVersion, input]
      additionalProperties: false
      properties:
        requestId:
          type: string
          minLength: 1
          description: Opaque Core API A6 request identifier.
        generation:
          type: integer
          minimum: 1
          description: Project analysis generation associated with the A6 attempt.
        contractVersion:
          type: string
          minLength: 1
          description: Version of this analysis DTO contract.
        input:
          $ref: "#/components/schemas/AnalysisInput"
    AnalysisInput:
      type: object
      required: [kind, documentId, deadline]
      additionalProperties: false
      oneOf:
        - required: [content]
        - required: [contentBase64]
      properties:
        kind:
          type: string
          enum: [pdf, markdown, text]
        documentId:
          type: string
        content:
          type: string
          description: Transient UTF-8 document content. It is never returned or persisted by AI Service.
        contentBase64:
          type: string
          description: Alternative base64 representation for binary PDF input.
        deadline:
          type: string
          format: date-time
    AnalysisResponse:
      type: object
      required: [requestId, generation, contractVersion, result]
      additionalProperties: false
      properties:
        requestId:
          type: string
        generation:
          type: integer
          minimum: 1
        contractVersion:
          type: string
        result:
          type: object
          additionalProperties: false
          description: Structured AI v2 analysis proposal; raw document and provider response are excluded.
          properties:
            schemaVersion:
              type: string
            profile:
              type: object
            fieldStates:
              type: object
            candidates:
              type: array
            questions:
              type: array
            safeWarnings:
              type: array
            modelMetadata:
              type: object
    SkillNeedsRequest:
      type: object
      required: [requestId, generation, contractVersion, input]
      additionalProperties: false
      properties:
        requestId: {type: string}
        generation: {type: integer, minimum: 1}
        contractVersion: {type: string}
        input:
          type: object
          required: [facts]
          additionalProperties: false
          properties:
            facts:
              type: array
              maxItems: 100
              items:
                $ref: "#/components/schemas/ConfirmedFact"
            deadline:
              type: string
              format: date-time
    SkillNeedsResponse:
      type: object
      required: [requestId, generation, contractVersion, result]
      properties:
        requestId: {type: string}
        generation: {type: integer}
        contractVersion: {type: string}
        result:
          type: object
          required: [needs, claims, questions]
    ConfirmedFact:
      type: object
      required: [id, field, value]
      additionalProperties: false
      properties:
        id:
          type: string
          description: Core-approved canonical source path.
          pattern: '^(profile\.(projectName|projectType|domain)|profile\.item\.(database|deployment|frontend|backend|ai|features|external_integrations)\.[0-9]+|developer\.version|environment\.(osFamily|clientId|clientVersion))$'
        field:
          type: string
        value:
          oneOf:
            - type: string
            - type: array
              items: {type: string}
    SkillRankRequest:
      type: object
      required: [requestId, generation, contractVersion, input]
      additionalProperties: false
      properties:
        requestId: {type: string}
        generation: {type: integer, minimum: 1}
        contractVersion: {type: string}
        input:
          type: object
          required: [needs, candidates]
          additionalProperties: false
          properties:
            needs:
              type: array
              maxItems: 6
            candidates:
              type: array
              maxItems: 15
    SkillRankResponse:
      type: object
      required: [requestId, generation, contractVersion, result]
      properties:
        requestId: {type: string}
        generation: {type: integer}
        contractVersion: {type: string}
        result:
          type: object
          required: [matches]
    InternalErrorResponse:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          type: object
          required: [code, message, requestId]
          additionalProperties: false
          properties:
            code:
              type: string
            message:
              type: string
            requestId:
              type: string
