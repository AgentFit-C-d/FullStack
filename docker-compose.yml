name: agentfit

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agentfit
      POSTGRES_USER: ${AGENTFIT_DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${AGENTFIT_DB_PASSWORD:?Set AGENTFIT_DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  ai:
    build:
      context: ./services/ai-service
    env_file:
      - path: ./.env
        required: true
      - path: ./.env.docker
        required: false
    environment:
      API_INTERNAL_URL: http://core:8080
      AI_INTERNAL_ALLOWED_HTTP_HOSTS: core
      AI_SERVICE_TOKEN: ${AGENTFIT_AI_SERVICE_TOKEN:?Set AGENTFIT_AI_SERVICE_TOKEN in .env}
    ports:
      - "8001:8001"

  core:
    build:
      context: ./services/core-api
    env_file:
      - path: ./.env
        required: true
    environment:
      AGENTFIT_DB_URL: jdbc:postgresql://db:5432/agentfit
      AGENTFIT_AI_SERVICE_URL: http://ai:8001/internal/v1/analysis
      AGENTFIT_WEB_ORIGIN: http://localhost:5173
      AGENTFIT_COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_started
    ports:
      - "8080:8080"

  web:
    build:
      context: ./apps/web
    environment:
      VITE_CORE_API_URL: http://core:8080
    depends_on:
      core:
        condition: service_started
    ports:
      - "5173:5173"

volumes:
  postgres-data:
