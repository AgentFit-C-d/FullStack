spring:
  application:
    name: agentfit-core-api
  datasource:
    url: ${AGENTFIT_DB_URL:jdbc:postgresql://localhost:5432/agentfit}
    username: ${AGENTFIT_DB_USERNAME:postgres}
    password: ${AGENTFIT_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: ${AGENTFIT_FLYWAY_ENABLED:true}
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}
            redirect-uri: ${AGENTFIT_GITHUB_REDIRECT_URI:http://localhost:8080/api/login/oauth2/code/github}
            scope:
              - user:email
  session:
    timeout: 7d
    jdbc:
      initialize-schema: never
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: 8080

agentfit:
  web-origin: ${AGENTFIT_WEB_ORIGIN:http://localhost:5173}
  analysis:
    timeout-seconds: ${AGENTFIT_ANALYSIS_TIMEOUT_SECONDS:600}
    cleanup-interval-seconds: ${AGENTFIT_ANALYSIS_CLEANUP_INTERVAL_SECONDS:10}
    execution-interval-seconds: ${AGENTFIT_ANALYSIS_EXECUTION_INTERVAL_SECONDS:1}
  auth:
    cookie-secure: ${AGENTFIT_COOKIE_SECURE:true}
  internal:
    ai-service-token: ${AGENTFIT_AI_SERVICE_TOKEN:}
  hmac:
    current-key-id: ${AGENTFIT_HMAC_CURRENT_KEY_ID:}
    current-secret: ${AGENTFIT_HMAC_CURRENT_SECRET:}
    previous-key-id: ${AGENTFIT_HMAC_PREVIOUS_KEY_ID:}
    previous-secret: ${AGENTFIT_HMAC_PREVIOUS_SECRET:}
    previous-valid-until: ${AGENTFIT_HMAC_PREVIOUS_VALID_UNTIL:}
