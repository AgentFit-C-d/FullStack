[project]
name = "agentfit-ai-service"
version = "0.1.0"
description = "FastAPI AI service for AgentFit"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "jsonschema>=4.23.0,<5.0.0",
    "pypdf>=5.0.0,<6.0.0",
    "reportlab>=4.2.0,<5.0.0",
    "referencing>=0.35.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "httpx>=0.27.0,<1.0.0",
]
evaluation = [
    "PyMuPDF>=1.24.0,<3.0.0",
    "ocrmypdf>=16.0.0,<18.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*", "evaluation*"]
