services:
  postgres:
    image: postgres:17-alpine
    container_name: agentfit-postgres-local
    environment:
      POSTGRES_DB: agentfit
      POSTGRES_USER: agentfit
      POSTGRES_PASSWORD: ${AGENTFIT_LOCAL_DB_PASSWORD:-agentfit-local-only}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - agentfit_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentfit -d agentfit"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  agentfit_postgres_data:
