# Apply after compose.fullstack.yaml and compose.demo.yaml.
services:
  core-api:
    ports: !override
      - "127.0.0.1:18080:8080"
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE: 10MB
      SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE: 11MB
      # The demo login does not need private email addresses.
      SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GITHUB_SCOPE: read:user

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - core-api
