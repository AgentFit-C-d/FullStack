# Apply after compose.fullstack.yaml and compose.demo.yaml.
services:
  core-api:
    ports: !override
      - "127.0.0.1:18080:8080"
    environment:
      SERVER_FORWARD_HEADERS_STRATEGY: framework

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - core-api
